server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  issuer: royal-medico-auth-service
  audience: royal-medico-gateway
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-validity-days: 7
